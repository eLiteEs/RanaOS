set timeout=8
set default=0

menuentry "RanaOS beta 2 (1920x1080)" {
    multiboot2 /boot/kernel.elf

    module2 /files/text.txt
    module2 /files/bg.pim
    module2 /files/tux.pim
    module2 /files/background.pim
    module2 /files/LICENSE
    module2 /files/cursor.pim
    module2 /files/program.elf

    insmod all_video
    insmod gfxterm
    insmod vbe
    insmod video_fb

    set gfxpayload=1920x1080x32
    set gfxmode=1920x1080x32
    terminal_output gfxterm

    boot
}

