set timeout=0
set default=0

menuentry "RanaOS beta 2" {
    set gfxpayload=1024x768x32
    insmod all_video
    multiboot /boot/kernel.elf
    module /files/ata_detect.cpp
    module /files/Console.cpp
    module /files/disk.cpp
    module /files/disk.hpp
    module /files/fat32.cpp
    module /files/text.txt
    boot
}