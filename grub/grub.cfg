set timeout=8
set default=0

menuentry "RanaOS beta 2" {
    multiboot2 /boot/kernel.elf

    module2 /files/text.txt
    module2 /files/bg.pim
    module2 /files/tux.pim
    module2 /files/background.pim

    insmod all_video
    insmod gfxterm
    insmod vbe
    insmod video_fb

    set gfxpayload=1920x1080x32
    set gfxmode=1920x1080x32
    terminal_output gfxterm

    boot
}

menuentry "RanaOS beta 2 (og mode)" {
    multiboot /boot/kernel.elf
    
    module /files/text.txt
    module /files/bg.pim
    module /files/tux.pim

    boot
}

menuentry "Reboot" {
    reboot
}
