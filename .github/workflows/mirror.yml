name: Mirror Codeberg → GitHub

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
        - name: Clone Codeberg
          run: |
                git clone --mirror \
                https://codeberg.org/blasf/RanaOS.git \
                repo.git
        - name: Push to GitHub
          run: |
                cd repo.git
                git remote add github \
                        https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
                git push --mirror github
