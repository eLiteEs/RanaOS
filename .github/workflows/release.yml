name: Build and Publish RanaOS

on:
  push:
    branches: [ main ]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            binutils \
            nasm \
            g++ \
            grub-pc-bin \
            xorriso \
            mtools \
            gcc-multilib \
            g++-multilib \
            jq
          rustup default nightly
          rustup target add i686-unknown-linux-gnu

      - name: Build ISO image
        run: make

      - name: Generate checksum
        run: sha256sum RanaOS.iso > RanaOS.sha256

      - name: Prepare artifact for Pages
        run: |
          mkdir -p public
          VERSION=""
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "main" ]]; then
            VERSION="nightly"
            mkdir -p public/nightly
            cp RanaOS.iso public/nightly/
            cp RanaOS.sha256 public/nightly/
          else
            VERSION="${GITHUB_REF_NAME}"
            mkdir -p public/${VERSION}
            cp RanaOS.iso public/${VERSION}/
            cp RanaOS.sha256 public/${VERSION}/
          fi

          # Copiar manifest si existe
          if [ -f manifest.json ]; then
            cp manifest.json public/
          elif [ -f public/manifest.json ]; then
            cp public/manifest.json .
          else
            echo '{"versions":[]}' > public/manifest.json
          fi

          # Actualizar manifest.json
          MANIFEST="public/manifest.json"
          URL_BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY}"

          jq --arg ver "$VERSION" --arg base "$URL_BASE" \
             '.versions |= [ .[] | select(.version != $ver) ] + [{version:$ver, iso:($base + "/" + $ver + "/RanaOS.iso"), sha256:($base + "/" + $ver + "/RanaOS.sha256")}]' \
             "$MANIFEST" > manifest.tmp && mv manifest.tmp "$MANIFEST"

      - name: Upload to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          force_orphan: true
